<!-- src/app/features/cliente/components/cliente-form/cliente-form.html -->
 
<div [formGroup]="form" class="form-grid">
 
  <div class="campo">
    <label for="nombre">Nombre completo *</label>
    <input id="nombre" type="text" formControlName="nombre"
           placeholder="Ej: Ana García" />
    <span class="error"
      *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched">
      El nombre es obligatorio
    </span>
  </div>
 
  <div class="campo">
    <label for="email">Correo electrónico *</label>
    <input id="email" type="email" formControlName="email"
           placeholder="Ej: ana@email.com" />
    <span class="error"
      *ngIf="form.get('email')?.hasError('required') && form.get('email')?.touched">
      El email es obligatorio
    </span>
    <span class="error"
      *ngIf="form.get('email')?.hasError('email') && form.get('email')?.touched">
      Formato de email inválido
    </span>
  </div>
 
  <div class="campo">
    <label for="telefono">Teléfono *</label>
    <input id="telefono" type="tel" formControlName="telefono"
           placeholder="Ej: 3001234567" />
    <span class="error"
      *ngIf="form.get('telefono')?.invalid && form.get('telefono')?.touched">
      El teléfono es obligatorio
    </span>
  </div>
 
</div>
